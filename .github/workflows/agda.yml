name: Check Agda

on:
  push:
    branches: [main]
    paths:
      - 'zkir-spec/**'
  pull_request:
    paths:
      - 'zkir-spec/**'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Typecheck Agda
        run: |
          cd zkir-spec/src
          nix run .#agda -- zkir-v3/Main.agda
