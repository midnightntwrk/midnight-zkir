name: ZKIR Build and Test

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      # zkir-v3 is the default branch. Caches are only shared from the base
      # branch, so without a push run here every PR and merge group would
      # start with cold caches.
      - 'zkir-v3'
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# no top level default permissions for security reasons
permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io
            accept-flake-config = true

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      # Only pushes to the base branch save, so PRs can't evict the shared
      # cache (the repo's cache quota is small). cmd-format makes the key
      # track the nix toolchain rather than the runner's preinstalled rustc.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.os }}
          cmd-format: nix develop -c {0}
          save-if: ${{ github.event_name == 'push' }}

      # Run Cargo Clippy on the whole workspace with all features. This is
      # important to avoid bitrot of code that is feature gated behind
      # non-default features.
      # We still permit certain Clippy rules with `-A` args. since they will be
      # addressed in upcoming PRs and changes that are currently in progress.
      - name: Cargo clippy (--all-targets --workspace --all-features --all -- -Dwarnings -Aclippy::type_complexity -Aclippy::mutable_key_type -Aclippy::too_many_arguments -Aclippy::derived_hash_with_manual_eq -Aclippy::unbuffered_bytes)
        run: MIDNIGHT_PP='' nix develop -c cargo clippy --all-targets --workspace --all-features --all -- -Dwarnings -Aclippy::type_complexity -Aclippy::mutable_key_type -Aclippy::too_many_arguments -Aclippy::derived_hash_with_manual_eq -Aclippy::unbuffered_bytes

      - name: Cargo doc
        run: MIDNIGHT_PP='' nix develop -c cargo doc --all-features --no-deps

  audit:
    # Not in the merge queue: the advisory DB is fetched live, so a new
    # advisory published after approval would eject every queued PR.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Checkout base branch Cargo.lock
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: Cargo.lock
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # PRs fail only on advisories they introduce. Ones already on the base
      # branch are warnings here and get fixed there by cargo-audit-fix.yml,
      # so an unrelated new advisory never forces a PR to be re-reviewed.
      - name: Cargo audit (advisories introduced by this PR)
        if: github.event_name == 'pull_request'
        run: nix develop .#audit -c .github/scripts/cargo-audit-diff.sh base/Cargo.lock

      - name: Cargo audit
        if: github.event_name != 'pull_request'
        run: nix develop .#audit -c cargo audit

  build-nix:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write # cache-nix-action purge deletes old caches
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io file://${{ runner.temp }}/nix-binary-cache
            accept-flake-config = true

      # Worth it here (unlike the cargo jobs) because the nix build vendors
      # every crate in Cargo.lock as a separate download. The key includes the
      # arch and job so jobs don't restore (or purge) each other's stores, and
      # only base-branch pushes save.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          save: ${{ github.event_name == 'push' }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          purge-created: 0

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      - name: Build zkir
        run: nix build .#zkir

      - name: Build test artifacts
        run: nix build .#test-artifacts

  # Build once per OS, then run the tests across parallel shards; see
  # test.yml and .github/scripts/nextest-shard.sh.
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ matrix.os }}

  # Reports the per-OS check names ("build-and-test (<os>)") that existed
  # before the tests were sharded, so branch protection keeps working. Each
  # one reflects the result of all OSes, as `needs` can't select one matrix
  # leg; the individual shard jobs show which OS failed.
  build-and-test:
    if: ${{ !cancelled() }}
    needs: tests
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check test results
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          echo "Tests: ${RESULT}"
          [ "$RESULT" = "success" ]
