name: Test

# Builds the test suite once on `os`, then runs it split across parallel
# shards. .github/scripts/nextest-shard.sh decides the shards and which tests
# each one runs.
#
# Called from ci.yml once per OS. As a separate workflow, each OS's shards
# start as soon as that OS's build finishes, instead of all waiting for the
# slowest platform's build (which is what `needs` on a matrix job does).

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

# no top level default permissions for security reasons
permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  build:
    runs-on: ${{ inputs.os }}
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io
            accept-flake-config = true

      # Before the first `nix develop`, which the rust-cache step runs.
      - name: Fix Nix permissions (needed on macos self hosted runner)
        run: |
          sudo mkdir -m 0755 -p /nix/var/nix/{profiles,gcroots}/per-user/"$USER"
          sudo chown -R "$USER":nixbld /nix/var/nix/{profiles,gcroots}/per-user/"$USER"
        shell: bash # Ensure bash is used for these commands

      - name: Configure cargo
        run: .github/scripts/configure-cargo.sh

      # Only pushes to the base branch save; see ci.yml.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ inputs.os }}
          cmd-format: nix develop -c {0}
          save-if: ${{ github.event_name == 'push' }}

      - name: Build tests (default features)
        run: nix develop -c cargo nextest archive --release --archive-file nextest-archive.tar.zst

      - name: List shards
        id: shards
        run: echo "shards=$(.github/scripts/nextest-shard.sh --matrix)" >> "$GITHUB_OUTPUT"

      - name: Upload test archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nextest-archive-${{ inputs.os }}
          path: nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1

  shard:
    needs: build
    runs-on: ${{ inputs.os }}
    permissions:
      contents: read
    strategy:
      # Let the other shards finish, so one run reports every failure.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      # The archive holds only binaries; the source must be present too.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
            extra-substituters = https://cache.iog.io
            accept-flake-config = true

      - name: Fix Nix permissions (needed on macos self hosted runner)
        run: |
          sudo mkdir -m 0755 -p /nix/var/nix/{profiles,gcroots}/per-user/"$USER"
          sudo chown -R "$USER":nixbld /nix/var/nix/{profiles,gcroots}/per-user/"$USER"
        shell: bash # Ensure bash is used for these commands

      - name: Download test archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nextest-archive-${{ inputs.os }}

      # The test-runner shell has no Rust toolchain: just nextest, plus the
      # libc and public parameters the archived binaries were built against.
      - name: Test (shard ${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: nix develop .#test-runner -c .github/scripts/nextest-shard.sh "$SHARD" nextest-archive.tar.zst

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "zkir-test-results-${{ inputs.os }}-${{ matrix.shard }}"
          path: target/nextest/ci/test-results.xml
