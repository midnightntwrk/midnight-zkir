[workspace]
resolver = "3"
members = [
  "zkir",
  "zkir-wasm",
]

default-members = [
  "zkir",
]

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/midnightntwrk/midnight-zkir"

# base-crypto 1.1.0, serialize 1.2.0, and transient-crypto 4.0.0 are not yet
# published to crates.io; resolve them from the midnight-ledger repository, at
# the head of the `iquerejeta/verify-proof-clean` branch this workspace tracks
# (PR #738, which carries the `inner_proofs` rename of `ProofPreimage`). They all
# come from the same rev so their interlinked path dependencies unify to a single
# source.
[patch.crates-io]
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "4cec98a064eae60e8be6171f07bed148ce00b01d" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "4cec98a064eae60e8be6171f07bed148ce00b01d" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "4cec98a064eae60e8be6171f07bed148ce00b01d" }
# Not needed for the build itself, but without this transient-crypto pulls
# storage-core (and its macro crates) from crates.io at the same name+version
# as the git copies above, and nix's importCargoLock cannot vendor the same
# name+version from two sources.
midnight-storage-core = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "4cec98a064eae60e8be6171f07bed148ce00b01d" }
