[workspace]
resolver = "3"
members = [
  "zkir",
  "zkir-wasm",
]

default-members = [
  "zkir",
]

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/midnightntwrk/midnight-zkir"

# Used by the nix wasm packaging (bagel.nix); same settings as midnight-ledger.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# base-crypto 1.1.0, serialize 1.2.0, and transient-crypto 4.0.0 are not yet
# published to crates.io; resolve them from the midnight-ledger repository, at
# the merge commit of midnight-ledger PR #738 (verify_proof / inner_proofs).
# They all come from the same rev so their interlinked path dependencies unify
# to a single source.
[patch.crates-io]
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a3b17c6a5ef632790f78e7b44bef5e4ab232dbf4" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a3b17c6a5ef632790f78e7b44bef5e4ab232dbf4" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a3b17c6a5ef632790f78e7b44bef5e4ab232dbf4" }
# Not needed for the build itself, but without this transient-crypto pulls
# storage-core (and its macro crates) from crates.io at the same name+version
# as the git copies above, and nix's importCargoLock cannot vendor the same
# name+version from two sources.
midnight-storage-core = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "a3b17c6a5ef632790f78e7b44bef5e4ab232dbf4" }
